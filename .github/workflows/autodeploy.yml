name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd prova.windmasters.es

            BEFORE="$(git rev-parse HEAD)"
            git pull origin main
            AFTER="$(git rev-parse HEAD)"
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"

            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"

            # El codi va muntat al contenidor; només cal reconstruir la imatge
            # PHP si canvia Docker (si no, --build recompila intl/gd cada cop).
            if echo "$CHANGED" | grep -Eq '^(docker/|compose\.yaml|compose\.prod\.yaml)'; then
              $COMPOSE up -d --build
            else
              $COMPOSE up -d
            fi

            $COMPOSE exec -T prova.windmasters.es php artisan wayfinder:generate --with-form

            if [ ! -d node_modules ] || echo "$CHANGED" | grep -Eq '^(package\.json|package-lock\.json)'; then
              docker run --rm -e WAYFINDER_COMMAND=true -v "$(pwd):/app" -w /app node:24-bookworm \
                bash -c "npm ci && npm run build"
            else
              docker run --rm -e WAYFINDER_COMMAND=true -v "$(pwd):/app" -w /app node:24-bookworm \
                bash -c "npm run build"
            fi

            $COMPOSE exec -T prova.windmasters.es \
              sh -lc 'find storage/logs -type f -name "*.log" -size +20M -exec truncate -s 0 {} +; true'

            # Només imatges penjades. No esborrar la cache de build (força recompilar PHP).
            docker image prune -f
            df -h /
