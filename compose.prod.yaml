services:
    prova.windmasters.es:
        build: !override
            context: './docker/prod'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: barsaopinion-app
        restart: unless-stopped
        ports: !reset []
        depends_on: !override
            - mysql
            - redis
        networks:
            - sail
            - traefik
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik
            - traefik.http.routers.windmasters.rule=Host(`prova.windmasters.es`)
            - traefik.http.routers.windmasters.entrypoints=websecure
            - traefik.http.routers.windmasters.tls.certresolver=le
            - traefik.http.services.windmasters.loadbalancer.server.port=80
    mysql:
        restart: unless-stopped
        ports: !reset []
    mailpit:
        profiles:
            - donotstart
networks:
    traefik:
        external: true
